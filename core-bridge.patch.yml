# Experimental v2 core process composition. The regular TUI row is disabled
# so stdout is reserved exclusively for core-protocol JSON-RPC frames.
- id: cute-dsh-tui
  disabled: true

- insert:
    - id: cute-dsh-tui-core-bridge
      name: '@heluo0991/cute-dsh-tui/core-bridge'
      config:
        provider: !!js process.env.CUTE_DSH_TUI_CORE_PROVIDER ?? undefined
        model: !!js process.env.CUTE_DSH_TUI_CORE_MODEL ?? undefined
